name: oukitel-rt7-linux

services:
  android-tools:
    build:
      context: ./containers/android-tools
    image: local/oukitel-rt7-android-tools:34.0.4
    container_name: rt7-adb
    init: true
    restart: unless-stopped
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
      - adb-home:/root/.android

  kernel-builder:
    build:
      context: ./containers/kernel-builder
    image: local/oukitel-rt7-kernel-builder:ubuntu-24.04
    entrypoint: ["/bin/sh", "/project/scripts/kernel-builder-entrypoint.sh"]
    # Named volumes start root-owned on Docker Desktop. The builder is isolated
    # and needs to create the initial Linux checkout in that volume.
    user: "0:0"
    working_dir: /work
    volumes:
      - kernel-source:/work/kernel
      - kernel-modules-source:/work/modules
      - clang-toolchain:/work/toolchain
      - kernel-build:/work/build
      - type: bind
        source: .
        target: /project
        read_only: true
      - type: bind
        source: ${RT7_WORK_DIR:-../oukitel-rt7-linux-work}
        target: /rt7-work

  recovery-reader:
    build:
      context: ./containers/mtkclient
      args:
        MTKCLIENT_COMMIT: 4d29037104b1f378abedcace89ccd48e8a8aa314
    image: local/oukitel-rt7-mtkclient:2.1.4
    # The tablet is attached to docker-desktop with usbipd-win. Raw USB access
    # is needed by libusb, while the runtime network is deliberately disabled.
    privileged: true
    network_mode: none
    working_dir: /rt7-work/recovery
    entrypoint:
      - /opt/venv/bin/python
      - /project/scripts/capture-recovery-baseline.py
    volumes:
      - type: bind
        source: /dev/bus/usb
        target: /dev/bus/usb
      - type: bind
        source: .
        target: /project
        read_only: true
      - type: bind
        source: ${RT7_WORK_DIR:-../oukitel-rt7-linux-work}
        target: /rt7-work

  rootfs-packager:
    build:
      context: ./containers/rootfs-packager
    image: local/oukitel-rt7-rootfs-packager:ubuntu-24.04
    network_mode: none
    volumes:
      - type: bind
        source: .
        target: /project
        read_only: true
      - type: bind
        source: ${RT7_WORK_DIR:-../oukitel-rt7-linux-work}
        target: /rt7-work

volumes:
  adb-home:
  kernel-source:
  kernel-modules-source:
  clang-toolchain:
  kernel-build:
